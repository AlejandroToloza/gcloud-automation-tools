[project]
name = "gcloud-automation-tools"
version = "0.1.0"
description = "Automatizaciones de Genesys Cloud (usuarios, colas, roles, contactos externos) sobre su API oficial."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "requests",
    "pandas",
    "openpyxl",
    "python-dotenv",
]

[project.scripts]
gcloud-tools = "gcloud_tools.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gcloud_tools"]
